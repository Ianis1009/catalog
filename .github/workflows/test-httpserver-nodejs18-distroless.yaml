\name: Test httpserver-nodejs18-distroless

on:
  push:
    branches:
      - test/httpserver-nodejs18-distroless-workflow
  pull_request:
    paths:
      - "examples/httpserver-nodejs18-distroless/**"
      - ".github/workflows/test-httpserver-nodejs18-distroless.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/examples/httpserver-nodejs18-distroless \
            kraftkit.sh/base:latest \
            kraft build .

      - name: Check build
        run: |
          test -d examples/httpserver-nodejs18-distroless/.unikraft
          du -sh examples/httpserver-nodejs18-distroless/.unikraft
          find examples/httpserver-nodejs18-distroless/.unikraft -maxdepth 3 -type f -print

      - name: Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/examples/httpserver-nodejs18-distroless/.unikraft:/scan:ro" \
            aquasec/trivy:latest \
            fs --no-progress --exit-code 0 /scan

      - name: Run with QEMU
        run: |
          docker run --rm \
            --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/examples/httpserver-nodejs18-distroless \
            -p 8080:8080 \
            kraftkit.sh/base:latest \
            kraft run \
              --no-prompt \
              --no-check-updates \
              --plat qemu \
              --arch x86_64 \
              -M 512M \
              .

      - name: Test HTTP server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080 > response.txt; then
              break
            fi
            sleep 2
          done

          cat response.txt
          grep -Fxq "Bye, World!" response.txt