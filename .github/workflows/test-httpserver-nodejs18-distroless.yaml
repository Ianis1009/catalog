name: Test httpserver-nodejs18-distroless

on:
  push:
    branches:
      - test/httpserver-nodejs18-distroless-workflow
  pull_request:
    paths:
      - "examples/httpserver-nodejs18-distroless/**"
      - ".github/workflows/test-httpserver-nodejs18-distroless.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            qemu-kvm \
            qemu-system-x86

      - name: Build with KraftKit
        uses: unikraft/kraftkit@stable
        with:
          workdir: examples/httpserver-nodejs18-distroless
          kraftfile: Kraftfile
          arch: x86_64
          plat: qemu

      - name: Inspect build
        working-directory: examples/httpserver-nodejs18-distroless
        run: |
          echo "Build artifacts:"
          find .unikraft -maxdepth 3 -type f -print 2>/dev/null || true
          du -sh .unikraft 2>/dev/null || true

      - name: Test with QEMU
        working-directory: examples/httpserver-nodejs18-distroless
        timeout-minutes: 5
        env:
          KRAFTKIT_NO_PROMPT: "true"
          KRAFTKIT_NO_CHECK_UPDATES: "true"
        run: |
          set -e

          kraft run \
            --rm \
            --no-prompt \
            --no-check-updates \
            -p 8080:8080 \
            --plat qemu \
            --arch x86_64 \
            -M 512M \
            . > kraft-run.log 2>&1 &

          KRAFT_PID=$!

          cleanup() {
            kill "$KRAFT_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080 > response.txt 2>/dev/null; then
              echo "Server is ready."
              break
            fi

            if ! kill -0 "$KRAFT_PID" 2>/dev/null; then
              echo "Kraft exited unexpectedly."
              cat kraft-run.log
              exit 1
            fi

            sleep 2
          done

          test -s response.txt
          cat response.txt
          grep -Fxq "Bye, World!" response.txt

          echo "httpserver-nodejs18-distroless test passed."

      - name: Show Kraft logs
        if: always()
        working-directory: examples/httpserver-nodejs18-distroless
        run: |
          cat kraft-run.log 2>/dev/null || true