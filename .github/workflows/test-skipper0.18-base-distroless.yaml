name: Test Skipper 0.18 Base Distroless

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/skipper0.18-base-distroless/**"
      - ".github/workflows/test-skipper0.18-base-distroless.yaml"
  pull_request:
    paths:
      - "examples/skipper0.18-base-distroless/**"
      - ".github/workflows/test-skipper0.18-base-distroless.yaml"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KraftKit
        run: |
          curl -sSfL https://get.kraftkit.sh | \
            sudo DEBIAN_FRONTEND=noninteractive sh -s -- -y

      - name: Build Unikernel
        working-directory: examples/skipper0.18-base-distroless
        run: |
          kraft build --plat qemu --arch x86_64 .

      - name: Measure rootfs size
        working-directory: examples/skipper0.18-base-distroless
        run: |
          echo "Build directory:"
          du -sh .unikraft/build/ || true

          echo "Image/rootfs files:"
          find .unikraft/build/ -type f \
            \( -name "*.img" -o -name "*.cpio" \) \
            -exec du -h {} + || true

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: examples/skipper0.18-base-distroless
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm

      - name: Locate Unikernel artifact
        working-directory: examples/skipper0.18-base-distroless
        run: |
          echo "===== Build artifacts ====="
          find .unikraft/build/ -type f -print

          KERNEL=$(find .unikraft/build/ -type f \
            \( -name "qemu-x86_64" -o -name "unikraft" -o -name "kernel" \) \
            | head -n 1)

          if [ -z "$KERNEL" ]; then
            echo "Could not locate QEMU kernel artifact."
            exit 1
          fi

          echo "Using kernel artifact:"
          echo "$KERNEL"

          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"

      - name: Run Unikernel and validate HTTP response
        working-directory: examples/skipper0.18-base-distroless
        run: |
          set -e

          echo "Starting Unikernel directly with QEMU..."
          echo "Kernel: $KERNEL"

          qemu-system-x86_64 \
            -enable-kvm \
            -m 512M \
            -kernel "$KERNEL" \
            -append "console=ttyS0" \
            -nographic \
            -netdev user,id=net0,hostfwd=tcp::9090-:9090 \
            -device virtio-net-pci,netdev=net0 \
            > qemu.log 2>&1 &

          QEMU_PID=$!

          echo "Waiting for Skipper HTTP server..."

          HTTP_STATUS=""

          for i in {1..60}; do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU process exited unexpectedly."
              echo "===== QEMU log ====="
              cat qemu.log
              exit 1
            fi

            HTTP_STATUS=$(curl -sS \
              -o response.txt \
              -w "%{http_code}" \
              http://127.0.0.1:9090 2>/dev/null || true)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Skipper HTTP server is ready."
              break
            fi

            sleep 2
          done

          echo "===== QEMU log ====="
          cat qemu.log

          echo "===== HTTP status ====="
          echo "$HTTP_STATUS"

          echo "===== HTTP response ====="
          cat response.txt 2>/dev/null || true

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Skipper HTTP server did not return HTTP 200."
            exit 1
          fi

          if ! grep -q "Bye, World!" response.txt; then
            echo "Unexpected HTTP response."
            echo "Expected: Bye, World!"
            echo "Actual response:"
            cat response.txt
            exit 1
          fi

          echo "Root route validated successfully."

          echo "===== Testing 404 route ====="

          HTTP_STATUS=$(curl -sS \
            -o not-found.txt \
            -w "%{http_code}" \
            http://127.0.0.1:9090/test)

          echo "HTTP status: $HTTP_STATUS"
          echo "HTTP response:"
          cat not-found.txt

          if [ "$HTTP_STATUS" != "404" ]; then
            echo "Unexpected HTTP status for /test."
            exit 1
          fi

          if ! grep -q "No route entry" not-found.txt; then
            echo "Unexpected HTTP response for /test."
            exit 1
          fi

          echo "404 route validated successfully."

          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true