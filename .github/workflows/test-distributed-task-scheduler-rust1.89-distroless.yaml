name: Test Distributed Task Scheduler Rust 1.89 Distroless

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/distributed-task-scheduler-rust1.89-distroless/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "examples/distributed-task-scheduler-rust1.89-distroless/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KraftKit
        run: curl -sSfL https://get.kraftkit.sh | sudo DEBIAN_FRONTEND=noninteractive sh -s -- -y

      - name: Build Unikernel
        working-directory: examples/distributed-task-scheduler-rust1.89-distroless
        run: kraft build --plat qemu --arch x86_64 .

      - name: Measure RootFS
        working-directory: examples/distributed-task-scheduler-rust1.89-distroless
        run: |
          du -sh .unikraft/build/ || true
          find .unikraft/build/ -type f -name "*.img" -exec du -h {} + || true

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: examples/distributed-task-scheduler-rust1.89-distroless
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          sudo chmod 666 /dev/kvm

      - name: Run Unikernel
        working-directory: examples/distributed-task-scheduler-rust1.89-distroless
        run: |
          timeout 20s kraft run --rm -M 128M \
            -e SCHEDULER_ROLE=coordinator \
            -e SCHEDULER_PORT=8080 \
            || true

      - name: Build Docker Image
        working-directory: examples/distributed-task-scheduler-rust1.89-distroless
        run: docker build -t distributed-task-scheduler .

      - name: Test Scheduler
        run: |
          set -e

          docker network create scheduler-net

          docker run -d \
            --name scheduler \
            --network scheduler-net \
            -p 8080:8080 \
            -e SCHEDULER_ROLE=coordinator \
            -e SCHEDULER_PORT=8080 \
            distributed-task-scheduler

          docker run -d \
            --name worker-1 \
            --network scheduler-net \
            -e SCHEDULER_ROLE=worker \
            -e WORKER_ID=worker-1 \
            -e WORKER_PORT=9001 \
            -e WORKER_ADDRESS=worker-1:9001 \
            -e COORDINATOR_ADDRESS=scheduler:8080 \
            distributed-task-scheduler

          docker run -d \
            --name worker-2 \
            --network scheduler-net \
            -e SCHEDULER_ROLE=worker \
            -e WORKER_ID=worker-2 \
            -e WORKER_PORT=9002 \
            -e WORKER_ADDRESS=worker-2:9002 \
            -e COORDINATOR_ADDRESS=scheduler:8080 \
            distributed-task-scheduler

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health | grep -q "coordinator: healthy" &&
               curl -fsS http://localhost:8080/workers | grep -q "worker-1" &&
               curl -fsS http://localhost:8080/workers | grep -q "worker-2"; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/workers

          response=$(curl -fsS -X POST \
            -d "type=add&value=10,32" \
            http://localhost:8080/tasks)

          echo "$response"

          task_id=$(echo "$response" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')
          test -n "$task_id"

          for i in {1..20}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "status=completed"; then
              break
            fi

            sleep 1
          done

          echo "$result" | grep -q "status=completed"
          echo "$result" | grep -q "result=42"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f scheduler worker-1 worker-2 2>/dev/null || true
          docker network rm scheduler-net 2>/dev/null || true