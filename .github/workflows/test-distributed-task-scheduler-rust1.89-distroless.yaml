name: Test distributed-task-scheduler-rust1.89-distroless

on:
  push:
    branches:
      - test/distributed-task-scheduler-rust1.89-distroless-workflow
  pull_request:
    paths:
      - "examples/distributed-task-scheduler-rust1.89-distroless/**"
      - ".github/workflows/test-distributed-task-scheduler-rust1.89-distroless.yaml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/distributed-task-scheduler-rust1.89-distroless

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KraftKit
        working-directory: .
        run: |
          set -e

          VERSION="v0.12.15-43-g372a73d8"
          URL="https://github.com/unikraft/kraftkit/releases/download/${VERSION}/kraft-linux-amd64"

          curl -fsSL "$URL" -o kraft
          chmod +x kraft
          sudo mv kraft /usr/local/bin/kraft

          kraft version

      - name: Build Unikraft image
        run: |
          kraft build --plat qemu --arch x86_64 .

      - name: Show Unikraft build output
        run: |
          test -d .unikraft/build
          du -sh .unikraft/build
          find .unikraft/build -maxdepth 2 -type f | head -50

      - name: Build Docker image
        run: |
          docker build -t distributed-task-scheduler-rust1.89-distroless .

      - name: Create Docker network
        working-directory: .
        run: |
          docker network create scheduler-net

      - name: Start coordinator
        working-directory: .
        run: |
          docker run -d \
            --name scheduler \
            --network scheduler-net \
            -p 8080:8080 \
            -e SCHEDULER_ROLE=coordinator \
            -e SCHEDULER_PORT=8080 \
            distributed-task-scheduler-rust1.89-distroless

      - name: Start worker 1
        working-directory: .
        run: |
          docker run -d \
            --name worker-1 \
            --network scheduler-net \
            -e SCHEDULER_ROLE=worker \
            -e WORKER_ID=worker-1 \
            -e WORKER_PORT=9001 \
            -e WORKER_ADDRESS=worker-1:9001 \
            -e COORDINATOR_ADDRESS=scheduler:8080 \
            distributed-task-scheduler-rust1.89-distroless

      - name: Start worker 2
        working-directory: .
        run: |
          docker run -d \
            --name worker-2 \
            --network scheduler-net \
            -e SCHEDULER_ROLE=worker \
            -e WORKER_ID=worker-2 \
            -e WORKER_PORT=9002 \
            -e WORKER_ADDRESS=worker-2:9002 \
            -e COORDINATOR_ADDRESS=scheduler:8080 \
            distributed-task-scheduler-rust1.89-distroless

      - name: Wait for coordinator and workers
        working-directory: .
        run: |
          for i in {1..30}; do
            health=$(curl -fsS http://localhost:8080/health || true)
            workers=$(curl -fsS http://localhost:8080/workers || true)

            echo "$health"
            echo "$workers"

            if echo "$health" | grep -q "coordinator: healthy" &&
               echo "$workers" | grep -q "worker-1" &&
               echo "$workers" | grep -q "worker-2"; then
              exit 0
            fi

            sleep 1
          done

          echo "Coordinator/workers did not become ready"
          exit 1

      - name: Test health endpoint
        working-directory: .
        run: |
          response=$(curl -fsS http://localhost:8080/health)
          echo "$response"
          echo "$response" | grep -q "coordinator: healthy"

      - name: Test workers endpoint
        working-directory: .
        run: |
          response=$(curl -fsS http://localhost:8080/workers)
          echo "$response"
          echo "$response" | grep -q "worker-1"
          echo "$response" | grep -q "worker-2"

      - name: Test echo task
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "type=echo&value=hello-unikraft" \
            http://localhost:8080/tasks)

          echo "$response"

          task_id=$(echo "$response" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')
          test -n "$task_id"

          for i in {1..20}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "status=completed"; then
              break
            fi

            sleep 1
          done

          echo "$result" | grep -q "status=completed"
          echo "$result" | grep -q "result=hello-unikraft"

      - name: Test add task
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "type=add&value=10,32" \
            http://localhost:8080/tasks)

          echo "$response"

          task_id=$(echo "$response" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')
          test -n "$task_id"

          for i in {1..20}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "status=completed"; then
              break
            fi

            sleep 1
          done

          echo "$result" | grep -q "status=completed"
          echo "$result" | grep -q "result=42"

      - name: Test fib task
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "type=fib&value=20" \
            http://localhost:8080/tasks)

          echo "$response"

          task_id=$(echo "$response" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')
          test -n "$task_id"

          for i in {1..20}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "status=completed"; then
              break
            fi

            sleep 1
          done

          echo "$result" | grep -q "status=completed"
          echo "$result" | grep -q "result=6765"

      - name: Test concurrent tasks
        working-directory: .
        run: |
          response1=$(curl -fsS -X POST \
            -d "type=sleep&value=5" \
            http://localhost:8080/tasks)

          response2=$(curl -fsS -X POST \
            -d "type=sleep&value=5" \
            http://localhost:8080/tasks)

          echo "$response1"
          echo "$response2"

          task1=$(echo "$response1" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')
          task2=$(echo "$response2" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')

          test -n "$task1"
          test -n "$task2"

          for i in {1..20}; do
            result1=$(curl -fsS "http://localhost:8080/tasks/$task1")
            result2=$(curl -fsS "http://localhost:8080/tasks/$task2")

            echo "$result1"
            echo "$result2"

            if echo "$result1" | grep -q "status=completed" &&
               echo "$result2" | grep -q "status=completed"; then
              break
            fi

            sleep 1
          done

          echo "$result1" | grep -q "status=completed"
          echo "$result2" | grep -q "status=completed"

      - name: Test invalid task
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "type=add&value=abc,10" \
            http://localhost:8080/tasks)

          echo "$response"

          task_id=$(echo "$response" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')
          test -n "$task_id"

          for i in {1..20}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "status=failed"; then
              break
            fi

            sleep 1
          done

          echo "$result" | grep -q "status=failed"
          echo "$result" | grep -q "invalid number"

      - name: Test missing task type
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "value=hello" \
            http://localhost:8080/tasks)

          echo "$response"
          echo "$response" | grep -q "missing type"

      - name: Test missing task value
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "type=echo" \
            http://localhost:8080/tasks)

          echo "$response"
          echo "$response" | grep -q "missing value"

      - name: Test unsupported task type
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "type=unknown&value=test" \
            http://localhost:8080/tasks)

          echo "$response"
          echo "$response" | grep -q "unsupported task type"

      - name: Test worker failure and task recovery
        working-directory: .
        run: |
          response=$(curl -fsS -X POST \
            -d "type=sleep&value=20" \
            http://localhost:8080/tasks)

          echo "$response"

          task_id=$(echo "$response" | sed -n 's/.*task=\([0-9][0-9]*\).*/\1/p')
          test -n "$task_id"

          assigned_worker=""

          for i in {1..15}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "worker=worker-1"; then
              assigned_worker="worker-1"
              break
            fi

            if echo "$result" | grep -q "worker=worker-2"; then
              assigned_worker="worker-2"
              break
            fi

            sleep 1
          done

          test -n "$assigned_worker"

          echo "Stopping assigned worker: $assigned_worker"
          docker stop "$assigned_worker"

          for i in {1..15}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "attempts=2"; then
              break
            fi

            sleep 1
          done

          echo "$result" | grep -q "attempts=2"

          docker start "$assigned_worker"

          for i in {1..30}; do
            result=$(curl -fsS "http://localhost:8080/tasks/$task_id")
            echo "$result"

            if echo "$result" | grep -q "status=completed"; then
              break
            fi

            sleep 1
          done

          echo "$result" | grep -q "status=completed"
          echo "$result" | grep -q "result=slept for 20 seconds"
          echo "$result" | grep -q "attempts=2"

      - name: Show final workers
        working-directory: .
        run: |
          curl -fsS http://localhost:8080/workers

      - name: Show logs on failure
        if: failure()
        working-directory: .
        run: |
          echo "=== scheduler ==="
          docker logs scheduler 2>&1 || true

          echo "=== worker-1 ==="
          docker logs worker-1 2>&1 || true

          echo "=== worker-2 ==="
          docker logs worker-2 2>&1 || true

      - name: Cleanup
        if: always()
        working-directory: .
        run: |
          docker rm -f scheduler worker-1 worker-2 2>/dev/null || true
          docker network rm scheduler-net 2>/dev/null || true