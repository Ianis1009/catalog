name: Test Rust HTTP Response Cache Distroless

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/http-response-cache-rust-distroless/**"
      - ".github/workflows/test-http-response-cache-rust-distroless.yml"
  pull_request:
    paths:
      - "examples/http-response-cache-rust-distroless/**"

jobs:
  build-benchmark-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KraftKit
        run: curl -sSfL https://get.kraftkit.sh | sudo DEBIAN_FRONTEND=noninteractive sh -s -- -y

      - name: Build Unikernel
        working-directory: examples/http-response-cache-rust-distroless
        run: kraft build --plat qemu --arch x86_64 .

      - name: Measure RootFS Size
        working-directory: examples/http-response-cache-rust-distroless
        run: |
          du -sh .unikraft/build/ || true
          find .unikraft/build/ -type f -name "*.img" -exec du -h {} + || true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "examples/http-response-cache-rust-distroless"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Install QEMU and Grant Permissions
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          sudo chmod 666 /dev/kvm

      - name: Test Docker Distroless Image
        working-directory: examples/http-response-cache-rust-distroless
        run: |
          docker build --pull -t http-response-cache-rust-distroless .

          docker run -d \
            --name http-response-cache-test \
            -p 8080:8080 \
            http-response-cache-rust-distroless

          sleep 2

          curl --fail http://localhost:8080/hello | tee response-1.txt
          grep -q "CACHE MISS: Generated response for /hello" response-1.txt

          curl --fail http://localhost:8080/hello | tee response-2.txt
          grep -q "CACHE HIT: Generated response for /hello" response-2.txt

          curl --fail http://localhost:8080/world | tee response-3.txt
          grep -q "CACHE MISS: Generated response for /world" response-3.txt

          curl --fail http://localhost:8080/world | tee response-4.txt
          grep -q "CACHE HIT: Generated response for /world" response-4.txt

          curl -sS \
            -o post-response.txt \
            -w "%{http_code}" \
            -X POST \
            http://localhost:8080/hello > post-status.txt

          test "$(cat post-status.txt)" = "405"
          grep -q "Method Not Allowed" post-response.txt

          docker rm -f http-response-cache-test

      - name: Run and Validate Output
        working-directory: examples/http-response-cache-rust-distroless
        run: |
          kraft run \
            --rm \
            -M 128M \
            -p 8080:8080 \
            . > kraft-run.log 2>&1 &

          KRAFT_PID=$!

          echo "Waiting for Unikraft HTTP server..."

          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/hello > response-1.txt 2>/dev/null; then
              echo "HTTP server is ready."
              break
            fi

            sleep 1
          done

          test -s response-1.txt
          grep -q "CACHE MISS: Generated response for /hello" response-1.txt

          curl --fail http://localhost:8080/hello | tee response-2.txt
          grep -q "CACHE HIT: Generated response for /hello" response-2.txt

          curl --fail http://localhost:8080/world | tee response-3.txt
          grep -q "CACHE MISS: Generated response for /world" response-3.txt

          curl --fail http://localhost:8080/world | tee response-4.txt
          grep -q "CACHE HIT: Generated response for /world" response-4.txt

          curl -sS \
            -o post-response.txt \
            -w "%{http_code}" \
            -X POST \
            http://localhost:8080/hello > post-status.txt

          test "$(cat post-status.txt)" = "405"
          grep -q "Method Not Allowed" post-response.txt

          kill "$KRAFT_PID" 2>/dev/null || true
          wait "$KRAFT_PID" 2>/dev/null || true

      - name: Check Unikraft Log
        if: always()
        working-directory: examples/http-response-cache-rust-distroless
        run: |
          if [ -f kraft-run.log ]; then
            cat kraft-run.log
          fi

      - name: Check for ELF Errors
        if: always()
        working-directory: examples/http-response-cache-rust-distroless
        run: |
          if [ -f kraft-run.log ]; then
            if grep -Eiq \
              "not position-independent|exec format error|ELF executable is not position-independent" \
              kraft-run.log; then
              echo "ERROR: ELF or executable format problem detected"
              exit 1
            fi
          fi