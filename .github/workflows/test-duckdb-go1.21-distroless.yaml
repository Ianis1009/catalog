name: Test DuckDB Go 1.21 Distroless

on:
  push:
    branches:
      - test/duckdb-go1.21-distroless-workflow
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KraftKit
        shell: bash
        run: |
          set -euxo pipefail

          KRAFT_VERSION="v0.12.1"

          curl -fsSL \
            "https://github.com/unikraft/kraftkit/releases/download/${KRAFT_VERSION}/kraft-linux-amd64" \
            -o /tmp/kraft

          chmod +x /tmp/kraft

          sudo install -m 0755 /tmp/kraft /usr/local/bin/kraft

          echo "===== KraftKit binary ====="
          ls -l /usr/local/bin/kraft
          file /usr/local/bin/kraft

      - name: Verify KraftKit
        shell: bash
        run: |
          set -euxo pipefail

          command -v kraft
          kraft version

      - name: Build and start DuckDB unikernel
        working-directory: examples/duckdb-go1.21-distroless
        shell: bash
        run: |
          set -euxo pipefail

          kraft run \
            --rm \
            --plat qemu \
            --arch x86_64 \
            -M 512M \
            -p 8080:8080 \
            . > kraft.log 2>&1 &

          KRAFT_PID=$!

          echo "KRAFT_PID=${KRAFT_PID}" >> "$GITHUB_ENV"

          echo "===== Waiting for DuckDB ====="

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080 > response.txt 2>/dev/null; then
              echo "DuckDB server is ready."
              break
            fi

            if ! kill -0 "$KRAFT_PID" 2>/dev/null; then
              echo "Kraft process exited unexpectedly."
              echo "===== Kraft log ====="
              cat kraft.log
              exit 1
            fi

            sleep 1
          done

          if [ ! -s response.txt ]; then
            echo "DuckDB server did not become ready."
            echo "===== Kraft log ====="
            cat kraft.log
            exit 1
          fi

          echo "===== DuckDB response ====="
          cat response.txt

      - name: Validate DuckDB response
        working-directory: examples/duckdb-go1.21-distroless
        shell: bash
        run: |
          set -euxo pipefail

          grep -F "id: %d, name: %s 42 John" response.txt

      - name: Show Kraft log
        if: always()
        working-directory: examples/duckdb-go1.21-distroless
        run: |
          cat kraft.log || true

      - name: Stop Kraft
        if: always()
        shell: bash
        run: |
          if [ -n "${KRAFT_PID:-}" ]; then
            kill "${KRAFT_PID}" 2>/dev/null || true
          fi